<div class="digital">
    <div class="time">
        <h1><span id="dig-clock">00:00:00</span></h1>
        <h3><span id="date">Date</span></h3>
        
        <!-- Toggle Switch UI -->
        <div class="format-toggle">
            <span class="toggle-label">12h</span>
            <label class="switch">
                <input type="checkbox" id="format-switch">
                <span class="slider"></span>
            </label>
            <span class="toggle-label">24h</span>
        </div>
    </div>
</div>
